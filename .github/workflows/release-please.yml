# Opens/updates the Release PR on every push to main; merging it tags vX.Y.Z,
# which triggers build_and_push.yml. Needs a PAT: tags pushed with GITHUB_TOKEN
# don't trigger other workflows.
name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
