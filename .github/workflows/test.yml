# Lint and unit tests. describe_schema and every query of the curated tools are checked against
# the owners of the StarRocks schema: the ETL (radiant-portal-pipeline) for the tables,
# the portal for the objects it creates in each tenant database (clinical views, views
# over its PostgreSQL tables, gene_panel_mv). Their main branches are checked out next
# to this repo, so a schema change that breaks the catalog or a query fails here.
name: Unit tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      # ruff only: the version pinned in the dev group, without the project dependencies.
      - name: Run ruff
        run: uv run --frozen --only-group dev ruff check --output-format=github .

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout the ETL (StarRocks schema owner)
        uses: actions/checkout@v4
        with:
          repository: radiant-network/radiant-portal-pipeline
          ref: main
          path: etl
          sparse-checkout: |
            radiant/dags/sql
            radiant/data_qa/macros
            radiant/tasks/data/radiant_tables.py
          sparse-checkout-cone-mode: false

      - name: Checkout the portal (owner of the tenant views)
        uses: actions/checkout@v4
        with:
          repository: radiant-network/radiant-portal
          ref: main
          path: portal
          sparse-checkout: |
            backend/scripts/seed/views
            backend/scripts/pcx_tables/access_controlled_views
            backend/scripts/init-sql/migrations
            backend/internal/types
            backend/internal/repository/starrocks/starrocks_tenant.go
          sparse-checkout-cone-mode: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        env:
          RADIANT_ETL_DIR: ${{ github.workspace }}/etl
          RADIANT_REQUIRE_ETL: "1"
          RADIANT_PORTAL_DIR: ${{ github.workspace }}/portal
          RADIANT_REQUIRE_PORTAL: "1"
        run: uv run pytest
