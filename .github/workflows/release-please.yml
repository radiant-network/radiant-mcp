# Opens/updates the Release PR on every push to main; merging it tags vX.Y.Z,
# which triggers build_and_push.yml. Uses a GitHub App token: tags and PRs created
# with GITHUB_TOKEN don't trigger other workflows.
name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Get a token to open the Release PR and push the tag
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
