[project]
name = "radiant-mcp"
version = "0.4.1"
description = "Radiant MCP server — mcp-server-starrocks wrapped with Keycloak OAuth and Radiant portal API tools"
requires-python = ">=3.11"
dependencies = [
    "mcp-server-starrocks==0.4.0",
    # fastmcp must stay <4: mcp-server-starrocks (<=0.4.0) imports fastmcp.tools.tool,
    # which fastmcp 4.0.0 removed (verified: 3.4.7 has it and KeycloakAuthProvider).
    "fastmcp>=3,<4",
    # Radiant portal API client (generated, not on PyPI) — pinned to a commit SHA
    # because the generated code floats with the upstream OpenAPI spec.
    "radiant-python-cli @ git+https://github.com/radiant-network/radiant-portal.git@616ace048346981e008b8db1e1ac9993e26fb088#subdirectory=cli/python",
    "scipy>=1.12",
    "matplotlib>=3.8",
]

# Deps-only project: radiant_mcp/ is COPY'd into the image and run from the
# working directory, not installed as a distribution.
[dependency-groups]
# Unit tests only; the image installs with --no-dev.
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = [".", "tests/unit"]
addopts = "-ra"

[tool.uv]
package = false
