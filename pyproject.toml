[project]
name = "radiant-mcp"
version = "0.4.1"
description = "Radiant MCP server — StarRocks SQL and Radiant portal API tools behind Keycloak OAuth"
requires-python = ">=3.11"
dependencies = [
    # 3.x is the tested major (KeycloakAuthProvider); move to 4 in its own change.
    "fastmcp>=3,<4",
    # >= 9.1: authentication_openid_connect_client plugin (JWT login to StarRocks).
    "mysql-connector-python>=9.1",
    # Radiant portal API client (generated, not on PyPI) — pinned to a commit SHA
    # because the generated code floats with the upstream OpenAPI spec.
    "radiant-python-cli @ git+https://github.com/radiant-network/radiant-portal.git@616ace048346981e008b8db1e1ac9993e26fb088#subdirectory=cli/python",
    "scipy>=1.12",
    "matplotlib>=3.8",
]

# Deps-only project: radiant_mcp/ is COPY'd into the image and run from the
# working directory, not installed as a distribution.
[dependency-groups]
# Unit tests only; the image installs with --no-dev.
dev = [
    "pytest>=8",
    "sqlglot>=30.30.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = [".", "tests/unit"]
addopts = "-ra"

[tool.uv]
package = false
